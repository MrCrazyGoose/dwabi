<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be my Valentine?</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffebee;
            text-align: center;
            overflow: hidden; 
            position: relative;
        }

        .heart {
            position: absolute;
            color: rgba(255, 64, 129, 0.4);
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: float-up linear forwards;
        }

        @keyframes float-up {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
            z-index: 10;
            max-width: 80%;
        }

        h1 { color: #d32f2f; font-size: 2.5rem; margin-bottom: 20px; }

        .buttons {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 100px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #yesBtn {
            background-color: #ff4081;
            color: white;
            z-index: 20; /* Keep Yes on top of everything */
        }

        /* Class for all No buttons */
        .no-style {
            background-color: #9e9e9e;
            color: white;
            position: absolute;
            z-index: 15;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h1 id="question">Will you be my Valentine, Ms. Khanna? ❤️</h1>
        <div class="buttons">
            <button id="yesBtn">Yes!</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <div class="container hidden" id="successContainer">
        <h1>Yay! I love youuu! 🥰</h1>
        <p>Wish you were here :(</p>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const mainContainer = document.getElementById('mainContainer');
        const successContainer = document.getElementById('successContainer');
        
        let yesSize = 1.2;

        // Function to move a button and spawn a new one
        function handleNoLogic(e) {
            const btn = e.target;
            
            // Move the current button
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.left = `${x}px`;
            btn.style.top = `${y}px`;

            // Make the Yes button grow
            yesSize += 0.15;
            yesBtn.style.transform = `scale(${yesSize})`;

            // Spawn a NEW "No" button
            spawnNewNo();
        }

        function spawnNewNo() {
            const newNo = document.createElement('button');
            newNo.innerHTML = "No";
            newNo.classList.add('no-style');
            
            // Random initial position for the new one
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            newNo.style.left = `${x}px`;
            newNo.style.top = `${y}px`;

            // Add the same "run away" logic to the new button
            newNo.addEventListener('mouseover', handleNoLogic);
            newNo.addEventListener('click', handleNoLogic);

            document.body.appendChild(newNo);
        }

        // Attach logic to the initial No button
        const initialNo = document.getElementById('noBtn');
        initialNo.addEventListener('mouseover', handleNoLogic);
        initialNo.addEventListener('click', handleNoLogic);

        // Success logic
        yesBtn.addEventListener('click', () => {
            mainContainer.classList.add('hidden');
            successContainer.classList.remove('hidden');
            // Remove all "No" buttons from the screen
            const allNos = document.querySelectorAll('.no-style');
            allNos.forEach(btn => btn.remove());
        });

        // Floating Hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (Math.random() * 20 + 15) + "px";
            heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHeart, 400);
    </script>
</body>
</html>
